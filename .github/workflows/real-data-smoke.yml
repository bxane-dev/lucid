name: real-data-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/real-data-smoke.yml"

jobs:
  public-eeg-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Download three real NEMAR participants
        working-directory: backend
        run: |
          python scripts/download_nemar.py             --dataset nm000113             --subjects sub-01,sub-02,sub-03

      - name: Prepare public EEG windows
        working-directory: backend
        run: python scripts/prepare_dataset.py --dataset nm000113

      - name: Train one real-data EEGNet epoch
        working-directory: backend
        run: |
          python scripts/train.py             --prepared ../dataset/prepared/nm000113_words.npz             --output ../models/eegnet_words.pt             --task words             --architecture eegnet             --epochs 1             --batch-size 32

      - name: Verify real-data outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          prepared = Path("dataset/prepared/nm000113_words.npz")
          model = Path("models/eegnet_words.pt")
          metrics = Path("models/eegnet_words.metrics.json")

          assert prepared.exists(), "prepared public EEG archive missing"
          assert model.exists(), "trained checkpoint missing"
          assert metrics.exists(), "metrics file missing"

          data = np.load(prepared, allow_pickle=False)
          subjects = set(data["groups"].tolist())
          split = data["split"]

          assert subjects == {"sub-01", "sub-02", "sub-03"}
          assert set(split.tolist()) == {0, 1, 2}
          assert len(set(data["groups"][split == 0].tolist())) == 1
          assert len(set(data["groups"][split == 1].tolist())) == 1
          assert len(set(data["groups"][split == 2].tolist())) == 1

          report = json.loads(metrics.read_text())
          assert report["dataset_id"] == "nm000113"
          assert report["architecture"] == "eegnet"
          assert report["task"] == "words"
          assert 0.0 <= report["test_balanced_accuracy"] <= 1.0

          print(
              json.dumps(
                  {
                      "subjects": sorted(subjects),
                      "trials": int(len(data["x"])),
                      "labels": data["labels"].tolist(),
                      "best_validation_balanced_accuracy": report[
                          "best_validation_balanced_accuracy"
                      ],
                      "test_balanced_accuracy": report[
                          "test_balanced_accuracy"
                      ],
                  },
                  indent=2,
              )
          )
          PY
