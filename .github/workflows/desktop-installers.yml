name: desktop-installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/desktop-installers.yml"
      - ".github/release-v1.json"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/desktop-installers.yml"
      - ".github/release-v1.json"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: lucid-windows-installer
          - os: ubuntu-latest
            target: linux
            artifact: lucid-linux-appimage

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build static Lucid frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend and packager
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build self-contained backend
        working-directory: backend
        run: pyinstaller --noconfirm --clean lucid_backend.spec

      - name: Smoke test packaged backend on Windows
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $env:LUCID_STORAGE_DIR = Join-Path $env:RUNNER_TEMP "lucid-smoke"
          $env:LUCID_DIAGNOSTIC_LOG = Join-Path $env:RUNNER_TEMP "lucid-backend-error.log"
          $exe = (Resolve-Path "backend/dist/lucid-backend/lucid-backend.exe").Path
          $stdout = Join-Path $env:RUNNER_TEMP "lucid-backend-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lucid-backend-stderr.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--host","127.0.0.1","--port","18765" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              $process.Refresh()
              if ($process.HasExited) {
                if (Test-Path $env:LUCID_DIAGNOSTIC_LOG) {
                  Get-Content $env:LUCID_DIAGNOSTIC_LOG
                }
                throw "Packaged Lucid backend exited before becoming healthy with code $($process.ExitCode)."
              }
              try {
                $health = Invoke-WebRequest "http://127.0.0.1:18765/health" -UseBasicParsing -TimeoutSec 1
                if ($health.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              if (Test-Path $env:LUCID_DIAGNOSTIC_LOG) {
                Get-Content $env:LUCID_DIAGNOSTIC_LOG
              }
              throw "Packaged Lucid backend did not become healthy."
            }
            $ui = Invoke-WebRequest "http://127.0.0.1:18765/" -UseBasicParsing -TimeoutSec 10
            if ($ui.StatusCode -ne 200 -or $ui.Content.Length -lt 100) {
              throw "Packaged Lucid frontend was not served correctly."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test packaged backend on Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          export LUCID_STORAGE_DIR="$RUNNER_TEMP/lucid-smoke"
          ./backend/dist/lucid-backend/lucid-backend --host 127.0.0.1 --port 18765 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18765/health >/tmp/lucid-health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Packaged Lucid backend did not become healthy."
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18765/ >/tmp/lucid-index.html
          test "$(wc -c </tmp/lucid-index.html)" -gt 100

      - name: Install desktop packager
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        if: matrix.target == 'win'
        working-directory: desktop
        run: npm run dist:win

      - name: Build Linux AppImage
        if: matrix.target == 'linux'
        working-directory: desktop
        run: npm run dist:linux

      - name: Verify Windows package contents
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $backend = "desktop/dist/win-unpacked/resources/backend/lucid-backend.exe"
          if (-not (Test-Path $backend)) {
            throw "Packaged Windows app is missing the Lucid backend executable."
          }
          $installer = Get-ChildItem "desktop/dist" -Filter "Lucid-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows NSIS installer was not produced."
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "desktop/dist/windows-installer.sha256"

      - name: Verify Linux package contents
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x desktop/dist/linux-unpacked/resources/backend/lucid-backend
          appimage=$(find desktop/dist -maxdepth 1 -name 'Lucid-*.AppImage' -print -quit)
          test -n "$appimage"
          sha256sum "$appimage" > desktop/dist/linux-appimage.sha256

      - name: Upload Windows installer
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/Lucid-Setup-*.exe
            desktop/dist/windows-installer.sha256
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/Lucid-*.AppImage
            desktop/dist/linux-appimage.sha256
            desktop/dist/latest-linux.yml
            desktop/dist/*.blockmap
          if-no-files-found: error


  release:
    if: >
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[release-v1]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: lucid-*
          path: release-assets
          merge-multiple: true

      - name: Inventory release assets
        run: |
          find release-assets -maxdepth 2 -type f -printf '%P\n' | sort
          test -n "$(find release-assets -name 'Lucid-Setup-1.0.0-*.exe' -print -quit)"
          test -n "$(find release-assets -name 'Lucid-1.0.0-*.AppImage' -print -quit)"
          test -f release-assets/latest.yml
          test -f release-assets/latest-linux.yml

      - name: Publish Lucid v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Lucid v1.0.0
          body_path: docs/RELEASE_NOTES_v1.0.0.md
          draft: false
          prerelease: false
          files: |
            release-assets/Lucid-Setup-1.0.0-*.exe
            release-assets/Lucid-1.0.0-*.AppImage
            release-assets/*.sha256
            release-assets/latest*.yml
            release-assets/*.blockmap
