name: v1-research-validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/v1-validation-trigger.json"
      - ".github/workflows/v1-research-validation.yml"
      - "backend/app/**"
      - "backend/scripts/**"

jobs:
  word-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install -r requirements.txt

      - name: Download all real nm000113 participants
        working-directory: backend
        run: python scripts/download_nemar.py --dataset nm000113 --subjects all

      - name: Prepare real nm000113 EEG
        working-directory: backend
        run: python scripts/prepare_dataset.py --dataset nm000113

      - name: Benchmark all six architectures
        working-directory: backend
        run: >
          python scripts/benchmark_models.py
          --prepared ../dataset/prepared/nm000113_words.npz
          --epochs 5
          --batch-size 32
          --seed 42
          --architectures
          eegnet
          cnn1d
          cnn_lstm
          temporal_cnn
          transformer
          eeg_conformer

      - name: Verify word benchmark evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          prepared = Path("dataset/prepared/nm000113_words.npz")
          report_path = Path("models/benchmarks/nm000113/words/benchmark.json")
          assert prepared.exists(), "prepared archive missing"
          assert report_path.exists(), "benchmark report missing"

          data = np.load(prepared, allow_pickle=False)
          report = json.loads(report_path.read_text())
          provenance = str(data["provenance_sha256"])

          assert len(set(data["groups"].tolist())) == 15
          assert set(data["split"].tolist()) == {0, 1, 2}
          assert report["dataset_id"] == "nm000113"
          assert report["task"] == "words"
          assert report["provenance_sha256"] == provenance
          assert report["ranking_metric"] == "validation_balanced_accuracy"
          assert len(report["results"]) == 6
          assert report["winner"] in {
              "eegnet",
              "cnn1d",
              "cnn_lstm",
              "temporal_cnn",
              "transformer",
              "eeg_conformer",
          }
          for item in report["results"]:
              assert 0.0 <= item["validation_balanced_accuracy"] <= 1.0
              assert 0.0 <= item["test_balanced_accuracy"] <= 1.0

          print(json.dumps({
              "subjects": sorted(set(data["groups"].tolist())),
              "trials": int(len(data["x"])),
              "provenance_sha256": provenance,
              "winner": report["winner"],
              "ranking": report["results"],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lucid-v1-word-benchmark
          path: |
            dataset/prepared/nm000113_words.npz.manifest.json
            models/benchmarks/nm000113/words/benchmark.json
            models/benchmarks/nm000113/words/*.metrics.json
          if-no-files-found: error

  state-path:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install -r requirements.txt

      - name: Download three real on003626 derivative participants
        working-directory: backend
        run: >
          python scripts/download_nemar.py
          --dataset on003626
          --subjects sub-01,sub-02,sub-03
          --derivatives-only

      - name: Prepare genuine inner-speech and resting-baseline EEG
        working-directory: backend
        run: python scripts/prepare_inner_speech.py --dataset on003626

      - name: Train real word model
        working-directory: backend
        run: >
          python scripts/train.py
          --prepared ../dataset/prepared/on003626_words.npz
          --output ../models/on003626_words_eegnet.pt
          --task words
          --architecture eegnet
          --epochs 3
          --batch-size 32
          --seed 42

      - name: Train real REST vs IMAGINED_SPEECH state model
        working-directory: backend
        run: >
          python scripts/train.py
          --prepared ../dataset/prepared/on003626_state.npz
          --output ../models/on003626_state_eegnet.pt
          --task state
          --architecture eegnet
          --epochs 3
          --batch-size 32
          --seed 42

      - name: Verify state/word provenance and labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import torch

          words = np.load("dataset/prepared/on003626_words.npz", allow_pickle=False)
          state = np.load("dataset/prepared/on003626_state.npz", allow_pickle=False)

          wp = str(words["provenance_sha256"])
          sp = str(state["provenance_sha256"])
          assert wp == sp
          assert set(words["groups"].tolist()) == {"sub-01", "sub-02", "sub-03"}
          assert set(state["groups"].tolist()) == {"sub-01", "sub-02", "sub-03"}
          assert set(state["labels"].tolist()) == {"rest", "imagined_speech"}
          assert set(words["labels"].tolist()) == {"up", "down", "right", "left"}

          word_checkpoint = torch.load(
              "models/on003626_words_eegnet.pt",
              map_location="cpu",
              weights_only=False,
          )
          state_checkpoint = torch.load(
              "models/on003626_state_eegnet.pt",
              map_location="cpu",
              weights_only=False,
          )
          assert word_checkpoint["provenance_sha256"] == wp
          assert state_checkpoint["provenance_sha256"] == sp
          assert word_checkpoint["task"] == "words"
          assert state_checkpoint["task"] == "state"

          for path in (
              Path("models/on003626_words_eegnet.metrics.json"),
              Path("models/on003626_state_eegnet.metrics.json"),
          ):
              metrics = json.loads(path.read_text())
              assert 0.0 <= metrics["test_balanced_accuracy"] <= 1.0

          print(json.dumps({
              "subjects": sorted(set(state["groups"].tolist())),
              "word_trials": int(len(words["x"])),
              "state_trials": int(len(state["x"])),
              "provenance_sha256": wp,
              "state_labels": state["labels"].tolist(),
              "word_labels": words["labels"].tolist(),
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lucid-v1-state-validation
          path: |
            dataset/prepared/on003626_words.npz.manifest.json
            dataset/prepared/on003626_state.npz.manifest.json
            models/on003626_words_eegnet.metrics.json
            models/on003626_state_eegnet.metrics.json
          if-no-files-found: error
